<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#1d0c3a 0%,#07030f 70%);font-family:'Outfit',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#wrap{position:absolute;left:50%;top:50%;width:480px;height:800px;transform-origin:center center;overflow:hidden;background:#000;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 120px rgba(255,90,180,.25)}
#gl,#c{position:absolute;inset:0;width:480px;height:800px;display:block}#c{pointer-events:none}
#avatar{visibility:hidden}
#loadErr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;background:#0b0618;z-index:99;font-size:15px;line-height:1.6}
/* screens fade + scale */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:scale(1.04);transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s;pointer-events:none}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s;pointer-events:auto}
.btn{position:relative;font-family:'Bungee',sans-serif;font-size:22px;border:none;border-radius:18px;padding:14px 26px;cursor:pointer;color:#1a0b2e;background:linear-gradient(180deg,#fff0a0,#ffd23f 45%,#f5a623);box-shadow:0 6px 0 #a8701a,0 12px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.7);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s,filter .2s;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
.btn.ghost::after,.btn.sm::after,.btn.icon::after{display:none}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 #a8701a,0 6px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.7)}
.btn.alt{background:linear-gradient(180deg,#ff9fd6,#ff5fb0 45%,#d63c95);color:#fff;box-shadow:0 6px 0 #8a1f5c,0 12px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.alt:active{box-shadow:0 2px 0 #8a1f5c}
.btn.cyan{background:linear-gradient(180deg,#9ff3ff,#3fd0ff 45%,#1b8fd6);color:#06223a;box-shadow:0 6px 0 #135d8c,0 12px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;font-size:14px;padding:10px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.btn.sm{font-size:14px;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 #a8701a}
.btn.sm:active{box-shadow:0 1px 0 #a8701a}
.btn.icon{width:66px;height:68px;padding:0;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;background:rgba(30,14,60,.72);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.icon span{font-family:'Outfit';font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
.btn.icon .badge{position:absolute;top:5px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#ff3d6e;font:800 11px Outfit;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 10px #ff3d6e}
.btn[disabled]{filter:grayscale(1) brightness(.55);cursor:default}
.coinpill{display:inline-flex;align-items:center;gap:8px;background:rgba(10,4,24,.55);border:2px solid rgba(255,214,90,.55);border-radius:30px;padding:5px 14px 5px 6px;font-weight:800;font-size:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd23f 40%,#d9900b 85%);box-shadow:inset 0 0 0 2px #e0a420,0 0 8px rgba(255,210,63,.5);display:inline-block;flex:none}
/* menu */
#menu{background:linear-gradient(180deg,rgba(10,4,26,.25),rgba(10,4,26,0) 30%,rgba(10,4,26,.15) 55%,rgba(10,4,26,.92));padding-top:22px}
#logo{width:330px;height:auto;filter:drop-shadow(0 10px 24px rgba(255,80,170,.45))}
@keyframes float{50%{transform:translateY(-6px) rotate(-.6deg)}}
#avatar{width:196px;height:220px;margin-top:-10px}
.menuinfo{display:flex;gap:10px;align-items:center;margin-top:-4px}
.rank{font-weight:800;font-size:13px;color:#9fe8ff;text-transform:uppercase;letter-spacing:1px;margin-top:8px;text-shadow:0 0 12px rgba(80,200,255,.6);max-width:400px;text-align:center;line-height:1.35}.rank .rt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank small{display:block;font-size:10px;letter-spacing:.6px;opacity:.65;font-weight:700;text-shadow:none}
.idle{font-size:12.5px;color:#d9c8ff;margin-top:3px;min-height:16px;text-align:center;padding:0 20px}
#playBtn{margin-top:10px;font-size:30px;padding:16px 56px;border-radius:22px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.045)}}
#playBtn:active{animation:none}
.iconrow{display:flex;gap:8px;margin-top:16px}
#tourBtn .badge{background:#3ddc97;box-shadow:0 0 10px #3ddc97;color:#06223a}
#lvBar{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:230px;display:none;text-align:center;pointer-events:none}
#lvBar.on{display:block}
#lvBar .t{font:800 11.5px Outfit;letter-spacing:1px;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#lvBar .b{height:8px;border-radius:5px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
#lvBar .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ddc97,#ffd23f);box-shadow:0 0 10px #ffd23f}
.lvtabs{display:flex;gap:6px;margin:10px 0}
.lvtabs button{flex:1;border:none;border-radius:12px;padding:9px;font:700 13px Bungee,sans-serif;background:rgba(255,255,255,.08);color:#cbb8f0;cursor:pointer}
.lvtabs button.on{background:linear-gradient(180deg,#ffd23f,#f5a623);color:#1a0b2e}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:470px;overflow-y:auto;padding:2px;touch-action:pan-y}
.lv{border:none;border-radius:14px;padding:8px 3px 7px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:#fff;cursor:pointer;font-family:Outfit;position:relative;transition:transform .12s}
.lv:active{transform:scale(.95)}
.lv b{display:block;font-family:Bungee;font-size:17px;line-height:1.1}
.lv span{display:block;font-size:9.5px;font-weight:700;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv em{display:block;font-style:normal;font-size:10px;color:#ffd23f;margin-top:2px;letter-spacing:1px}
.lv.lock{opacity:.4;filter:grayscale(.8)}
.lv.next{box-shadow:0 0 0 2px #3ddc97,0 0 16px rgba(61,220,151,.5)}
.topbtns{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}
.topbtns>*{pointer-events:auto}
.howto{display:none;position:absolute;bottom:14px;font-size:11.5px;color:#bba6e6;text-align:center;line-height:1.5;padding:0 24px;opacity:.85}
/* hud */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .4s,transform .4s}
#hud.on{opacity:1;transform:none}
#hud .tl{position:absolute;top:12px;left:14px}
#hScore{font-family:'Bungee';font-size:30px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(255,255,255,.25)}
#hMult{display:inline-block;margin-left:6px;vertical-align:top;font:800 13px Outfit;background:linear-gradient(180deg,#ff9fd6,#d63c95);padding:3px 7px;border-radius:8px;box-shadow:0 0 12px rgba(255,95,176,.6)}
#hDist{font:600 12px Outfit;opacity:.8;letter-spacing:1px;margin-top:4px}
#hud .tr{position:absolute;top:12px;right:62px}
#pauseBtn{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(10,4,24,.5);color:#fff;font-size:16px;pointer-events:auto;cursor:pointer;backdrop-filter:blur(8px)}
#hBoards{position:absolute;top:60px;right:12px;font:800 13px Outfit;background:rgba(10,4,24,.5);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 11px;backdrop-filter:blur(8px);pointer-events:auto;cursor:pointer}
#pups{position:absolute;top:96px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pup{display:flex;align-items:center;gap:7px;background:rgba(10,4,24,.55);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:800;backdrop-filter:blur(8px);animation:popin .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.pup .bar{width:64px;height:6px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.pup .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff7ac3);border-radius:4px}
#nowplaying{position:absolute;bottom:12px;left:12px;font:600 12px Outfit,sans-serif;color:#fff;background:rgba(10,4,24,.5);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:8px 13px;pointer-events:auto;cursor:pointer;backdrop-filter:blur(8px);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudMute{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(10,4,24,.5);color:#fff;pointer-events:auto;cursor:pointer;font-size:15px}
#hCoins{display:inline-block}#hCoins.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35);color:#ffd23f}}
#hypeBtn{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);pointer-events:auto;display:none;font-size:16px;padding:12px 18px}
#hypeBtn.on{display:block;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
#hypeBtn i{position:absolute;left:0;bottom:0;height:4px;background:#fff;opacity:.8}
/* big center text */
#big{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:'Bungee';font-size:64px;color:#fff;pointer-events:none;opacity:0;text-shadow:0 5px 0 #6a1d5a,0 0 30px rgba(255,120,200,.9)}
#big.go{animation:bigpop .9s cubic-bezier(.2,1.4,.4,1) forwards}
#big small{display:block;font-size:20px;color:#ffd23f;text-shadow:0 3px 0 #000}
@keyframes bigpop{0%{opacity:0;transform:scale(2.4)}25%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(-30px)}}
#hint{position:absolute;left:0;right:0;top:470px;text-align:center;font-family:'Bungee';font-size:22px;color:#ffd23f;text-shadow:0 3px 0 #000,0 0 14px rgba(255,210,63,.7);pointer-events:none;opacity:0;transition:opacity .25s}
#hint.on{opacity:1;animation:hintb .6s ease-in-out infinite alternate}
@keyframes hintb{to{transform:translateY(-8px)}}
/* panels */
.dim{background:rgba(8,3,20,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);justify-content:center}
.panel{background:linear-gradient(180deg,rgba(52,26,102,.96),rgba(23,10,48,.97));border:1px solid rgba(255,210,90,.35);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);transform:translateY(20px) scale(.96);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.screen.on .panel{transform:none}
.panel h2{font-family:'Bungee';font-size:32px;background:linear-gradient(180deg,#fff,#ff9fd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a0f35)}
#over .panel,#pause .panel,#revive .panel,#modal .panel{width:392px;padding:24px 22px;text-align:center}
.stats{margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px}
.stat b{display:block;font-family:'Bungee';font-size:24px;color:#ffd23f}
.stat.wide{grid-column:span 2}.stat.wide b{font-size:34px;color:#fff;text-shadow:0 0 16px rgba(255,255,255,.4)}
.stat span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.tipbox{background:rgba(110,200,255,.1);border-left:4px solid #6fd3ff;border-radius:12px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.45;margin-bottom:16px;color:#dff4ff}
.tipbox b{color:#9fe8ff}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ring{width:120px;height:120px;margin:16px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Bungee;font-size:40px}
.mis{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mis .ic{font-size:22px}
.mis .tx{flex:1;font-size:13.5px;font-weight:600}
.mis .pb{height:7px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.mis .pb i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#9ff3ff);border-radius:4px;transition:width .6s}
.mis small{font-size:11px;opacity:.65}
.multbadge{display:inline-block;font-family:Bungee;font-size:26px;background:linear-gradient(180deg,#ff9fd6,#d63c95);padding:4px 14px;border-radius:14px;margin:6px 0 12px;box-shadow:0 0 22px rgba(255,95,176,.5)}
.lb{display:flex;justify-content:space-between;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:6px;font-weight:600}
.lb b{font-family:Bungee;color:#ffd23f}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.day{border-radius:12px;padding:8px 2px;background:rgba(255,255,255,.07);font-size:11px;font-weight:800}
.day b{display:block;font-size:13px;color:#ffd23f;margin-top:3px}
.day.done{background:rgba(61,220,151,.25);color:#bfffe0}.day.today{background:linear-gradient(180deg,#ffd23f,#f5a623);color:#1a0b2e;box-shadow:0 0 16px rgba(255,210,63,.6)}.day.today b{color:#1a0b2e}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600}
.tog{width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .25s;border:none}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tog.on{background:#3ddc97}.tog.on::after{transform:translateX(22px)}
/* studio */
#studio{background:linear-gradient(180deg,#1d0c3a,#0e0620)}
.shead{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.shead h2{font-family:'Bungee';font-size:20px;background:linear-gradient(180deg,#fff3b0,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:5px;padding:0 14px;width:100%;position:relative}
.tab{flex:1;font-family:'Bungee';font-size:11.5px;padding:10px 0;border-radius:13px 13px 0 0;border:none;background:rgba(255,255,255,.06);color:#cbb8f0;cursor:pointer;transition:background .25s,color .25s}
.tab.on{background:#2a1452;color:#ffd23f}
.tabbody{flex:1;width:calc(100% - 28px);background:#2a1452;border-radius:0 0 18px 18px;overflow-y:auto;padding:12px;margin-bottom:14px;touch-action:pan-y}
.tabbody.anim>*{animation:slidein .4s cubic-bezier(.2,.9,.3,1) both}
.tabbody.anim>*:nth-child(2){animation-delay:.03s}.tabbody.anim>*:nth-child(3){animation-delay:.06s}.tabbody.anim>*:nth-child(4){animation-delay:.09s}.tabbody.anim>*:nth-child(5){animation-delay:.12s}.tabbody.anim>*:nth-child(6){animation-delay:.15s}.tabbody.anim>*:nth-child(n+7){animation-delay:.18s}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}}
.tabbody::-webkit-scrollbar{width:6px}.tabbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
#room{width:100%;height:auto;border-radius:14px;display:block;margin-bottom:10px}
.card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:10px 12px;margin-bottom:8px;transition:background .2s}
.card:hover{background:rgba(255,255,255,.09)}
.card .ic{font-size:26px;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);flex:none}
.card .info{flex:1;min-width:0}
.card .info b{font-size:15px}
.card .info .lv{font-size:11px;color:#ffd23f;font-weight:800;margin-left:6px}
.card .info p{font-size:12px;opacity:.75;margin-top:2px;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.f{background:#ffd23f;box-shadow:0 0 6px #ffd23f}
.costbtn{display:flex;align-items:center;gap:5px;white-space:nowrap}
.costbtn .coin{width:15px;height:15px}
.label-top{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.25);border-radius:16px;padding:12px;margin-bottom:10px}
.label-top .big{font-family:'Bungee';font-size:19px;color:#9fe8ff}
.label-top small{display:block;font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.ava{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bungee';font-size:18px;color:#1a0b2e;flex:none;box-shadow:0 0 14px rgba(255,255,255,.2)}
.section{font-family:'Bungee';font-size:12.5px;color:#cbb8f0;margin:12px 2px 8px;letter-spacing:1px}
.track.on{outline:2px solid #ffd23f;box-shadow:0 0 20px rgba(255,210,63,.25)}
.fact{font-size:12px;color:#bfe9ff;margin-top:4px;line-height:1.35}
.swatch{width:46px;height:46px;border-radius:13px;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.swatch i{position:absolute;left:0;right:0;bottom:0;height:40%}
.quizq{font-size:17px;font-weight:600;line-height:1.4;margin:6px 0 14px}
.qopt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font:600 15px 'Outfit';cursor:pointer;transition:transform .12s,background .2s}
.qopt:active{transform:scale(.98)}

#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
#toast b{color:#ffd23f}
#quick{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-family:Bungee,sans-serif;font-size:17px;color:#ffd23f;text-shadow:0 2px 0 #000,0 0 12px rgba(255,210,63,.6);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}

.lbx{position:absolute;left:0;right:0;height:64px;background:#000;pointer-events:none;transition:transform .7s cubic-bezier(.7,0,.2,1);z-index:5}

#charName small{font-size:11.5px;color:#ffc7ea;letter-spacing:1px;text-transform:uppercase}
#charName em{display:block;font-style:normal;font-size:11px;font-weight:800;color:#9fe8ff;margin-top:2px}
#charName.locked b{filter:grayscale(1) brightness(.7)}
#story{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px;background:radial-gradient(ellipse at center,rgba(0,0,0,.2),rgba(0,0,0,.75));cursor:pointer}
#story.on{display:flex}

#story p{margin-top:14px;font-size:16px;color:#ffd23f;letter-spacing:1px;opacity:0;transition:opacity .8s .35s}
#story.show h3{opacity:1;transform:none}#story.show p{opacity:1}
#story .skip{position:absolute;bottom:90px;font-size:12px;opacity:.6;letter-spacing:2px}
#flowc{width:100%;height:auto;border-radius:14px;display:block;touch-action:none;background:#120826}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

import * as THREE from 'three';

/* =====================================================================
   FAME THE GAME v2 — endless runner + music-label tycoon
   ===================================================================== */
const W=480, H=800;
const wrap=document.getElementById('wrap');
function fit(){const k=Math.min(innerWidth/W, innerHeight/H);wrap.style.transform=`translate(-50%,-50%) scale(${k})`;}
addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- Persistence ----------
const KEY='fame_the_game_3d_v1';
const DEF={coins:0,total:0,best:0,bestScore:0,runs:0,studio:{mic:0,board:0,speakers:0,booth:0,decor:0},artists:{},track:0,quiz:0,quizRight:0,last:Date.now(),muted:false,musicOn:true,hq:true,
  boards:3,hype:0,char:'fame',levels:{},lvTab:'usa',musicKind:'song',song:'going-down',songsUnlocked:{},pu:{magnet:0,dbl:0,jet:0,shoes:0},flags:{},ach:{},flowBest:0,story:false,beatsTotal:0,outfit:'classic',owned:['classic'],deck:'classic',decks:['classic'],missions:null,mDone:0,mult:1,daily:{last:'',streak:0},top:[],life:{jumps:0,slides:0,tops:0,powers:0,boards:0}};
let S;
function load(){
  S=JSON.parse(JSON.stringify(DEF));
  try{const j=JSON.parse(localStorage.getItem(KEY));if(j){Object.assign(S,j);S.studio=Object.assign({},DEF.studio,j.studio||{});S.artists=j.artists||{};S.life=Object.assign({},DEF.life,j.life||{});S.daily=Object.assign({},DEF.daily,j.daily||{});}}catch(e){}
}
function fixSave(){S.pu=Object.assign({magnet:0,dbl:0,jet:0,shoes:0},S.pu||{});S.flags=S.flags||{};S.ach=S.ach||{};}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
load();fixSave();

// ---------- Look / outfits ----------

function newMission(ex){const tier=Math.min(4,Math.floor(S.mDone/3));const opts=MT.filter(m=>!ex.includes(m.t));const m=pick(opts);return {t:m.t,n:m.n[tier],p:0,tier};}
function ensureMissions(){if(!S.missions||S.missions.length!==3){S.missions=[];for(let i=0;i<3;i++)S.missions.push(newMission(S.missions.map(m=>m.t)));}}

function mtpl(t){return MT.find(m=>m.t===t);}
function mission(t,val,abs){
  let changed=false;
  for(let i=0;i<3;i++){const m=S.missions[i];if(m.t!==t)continue;
    const before=m.p;m.p=abs?Math.max(m.p,val):m.p+val;if(m.p!==before)changed=true;
    if(m.p>=m.n){completeMission(i);}
  }
  return changed;
}
function completeMission(i){
  const m=S.missions[i];const reward=150*(m.tier+1);S.coins+=reward;S.total+=reward;S.mDone++;
  sfxJingle();confetti(60);
  let extra='';
  if(S.mDone%3===0){S.mult++;extra=`<br>🔥 <b>Score multiplier is now x${S.mult}!</b>`;}
  toast(`🎯 <b>Mission complete!</b> ${mtpl(m.t).f(m.n)} · +${reward} coins${extra}`);
  S.missions[i]=newMission(S.missions.map(x=>x.t));
  save();
}

const V3=THREE.Vector3;

function poseMenu(){const a=Math.PI+Math.sin(T*.22)*.5,r=5.7;return {p:new V3(Math.sin(a)*r,1.6+Math.sin(T*.37)*.12,-PZ+Math.cos(a)*r),l:new V3(0,1.42,-PZ)};}
function posePlay(){const jy=R.jet>0&&!(R.segKind==='tunnel'&&inSeg(R.dist+PZ,6))?1.4:0;return {p:new V3(R.x*.6,2.7+Math.max(0,R.y-.3)*.6+jy,-PZ+4.6+(R.alive?0:-2)),l:new V3(R.x*.8,.85+R.y*.55+jy*.3,-(PZ+9))};}
function updateCamera(dt){
  const playing=mode==='play'||mode==='pause'||mode==='revive'||mode==='over';
  const tg=playing?posePlay():poseMenu();
  if(intro>0&&introFrom.p){
    const e=ease(clamp(1-intro/INTRO));
    const f=introFrom.p,aS=Math.atan2(f.x,f.z+PZ),rS=Math.hypot(f.x,f.z+PZ);
    const a=lerp(aS,0,e);
    const r=lerp(rS,4.6,e)*(1-.6*Math.sin(e*Math.PI));
    camPos.set(Math.sin(a)*r,lerp(f.y,tg.p.y,e)+Math.sin(e*Math.PI)*2.6,-PZ+Math.cos(a)*r);
    camLook.lerpVectors(introFrom.l,tg.l,e);
    camRoll=Math.sin(e*Math.PI)*.09;
  }else{
    const kk=Math.min(1,dt*(playing?6:2));
    camPos.lerp(tg.p,kk);camLook.lerp(tg.l,kk);
    camRoll=lerp(camRoll,playing?(laneX(R.lane)-R.x)*-.05:Math.sin(T*.3)*.02,Math.min(1,dt*8));
  }
  camera.position.copy(camPos);
  if(shake>0)camera.position.add(new V3((Math.random()-.5)*shake*.35,(Math.random()-.5)*shake*.35,0));
  camera.lookAt(camLook);camera.rotateZ(camRoll);
  fovKick=lerp(fovKick,0,Math.min(1,dt*2.5));
  const fov=(playing?58+(R.speed-12.5)*.55+(R.jet>0?6:0)+(R.alive?0:-8):50)+fovKick+beatPulse*(playing?1.6:.9);
  if(Math.abs(camera.fov-fov)>.01){camera.fov=lerp(camera.fov,fov,Math.min(1,dt*5));camera.updateProjectionMatrix();}
}

function suggest(){
  const aff=ITEMS.filter(it=>S.studio[it.id]<it.max&&itemCost(it,S.studio[it.id])<=S.coins);
  if(aff.length){const it=aff[0];return `💡 <b>You can afford an upgrade!</b> ${it.icon} ${it.name} → ${it.eff(S.studio[it.id]+1)}.`;}
  const sa=ARTISTS.find(a=>!S.artists[a.id]&&a.cost<=S.coins&&signedCount()<slots());
  if(sa)return `💡 <b>You can sign ${sa.name}!</b> They’ll earn coins for your label while you run.`;
  if(S.boards===0&&S.coins>=250)return '💡 <b>Out of FAME Boards.</b> Grab more in the Shop — they save you from one crash.';
  const all=[...TRACKS.map(t=>t.fact),...ITEMS.flatMap(i=>i.tips.slice(0,1)),...ARTIST_TIPS];
  return '🎓 '+pick(all);
}

let FLOW=null,FLOWRES=null;
function flowStart(){
  initAudio();if(!AC)return;RADIO_CUR=null;
  if(curTrack<0||!S.musicOn){S.musicOn=true;if(musicBus)musicBus.gain.value=.72;playTrack(TRACKS[S.track]&&trackUnlocked(S.track)?S.track:0);toastQuick('Flow uses the studio beats');}
  const T0=TRACKS[curTrack],sd=60/T0.bpm/4;
  let tb=nextT+((16-step)%16)*sd;while(tb-AC.currentTime<1.6)tb+=16*sd;
  const notes=[];
  for(let b=0;b<8;b++)for(let st=0;st<16;st++){const t=tb+(b*16+st)*sd;
    if(T0.kick[st]==='x')notes.push({t,l:0});else if(T0.snare[st]==='x')notes.push({t,l:1});else if(st%4===2&&b%2===1)notes.push({t,l:2});}
  FLOW={notes,end:tb+8*16*sd,hits:0,perf:0,combo:0,best:0,msg:'GET READY',msgT:1.4,total:notes.length};FLOWRES=null;
  const bt=$('flowGo');if(bt)bt.disabled=true;
  const cv=$('flowc');if(cv)cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();flowHit(Math.min(2,Math.floor((e.clientX-r.left)/r.width*3)));};
}
function flowHit(l){if(!FLOW||!AC)return;const now=AC.currentTime;let bn=null,bd=1;for(const n of FLOW.notes){if(n.l!==l||n.done)continue;const d=Math.abs(n.t-now);if(d<bd){bd=d;bn=n;}}
  if(bn&&bd<.15){bn.done=true;FLOW.hits++;FLOW.combo++;FLOW.best=Math.max(FLOW.best,FLOW.combo);if(bd<.055){FLOW.perf++;FLOW.msg='PERFECT!';}else FLOW.msg='GOOD';blip([[523,659,784][l]*2],'triangle',0,.08,.08);buzz(6);}
  else{FLOW.combo=0;FLOW.msg='OFF BEAT';}
  FLOW.msgT=.45;FLOW.lane=l;FLOW.laneT=.15;}
function drawFlow(dt){
  const cv=$('flowc');if(!cv)return;const g=cv.getContext('2d'),w=cv.width,h=cv.height,lw=w/3,hy=h-70;
  g.clearRect(0,0,w,h);const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#1a0b38');bg.addColorStop(1,'#2a1452');g.fillStyle=bg;g.fillRect(0,0,w,h);
  const cols=['#ff5fb0','#4ff7ff','#ffd23f'],labs=['KICK','SNARE','HAT'];
  for(let l=0;l<3;l++){g.fillStyle=FLOW&&FLOW.lane===l&&FLOW.laneT>0?'rgba(255,255,255,.12)':(l%2?'rgba(255,255,255,.03)':'rgba(255,255,255,.06)');g.fillRect(l*lw,0,lw,h);
    g.fillStyle=cols[l];g.globalAlpha=.85;g.font='bold 13px Bungee, sans-serif';g.textAlign='center';g.fillText(labs[l],l*lw+lw/2,h-22);g.globalAlpha=1;}
  g.strokeStyle='#fff';g.lineWidth=3;g.shadowColor='#fff';g.shadowBlur=12*(1+beatPulse);g.beginPath();g.moveTo(0,hy);g.lineTo(w,hy);g.stroke();g.shadowBlur=0;
  if(FLOW&&AC){const now=AC.currentTime;FLOW.laneT-=dt;
    for(const n of FLOW.notes){if(n.done)continue;const y=hy-(n.t-now)*320;if(y<-20)continue;if(now-n.t>.15&&!n.miss){n.miss=true;FLOW.combo=0;}
      if(n.miss){g.globalAlpha=.25;}g.fillStyle=cols[n.l];g.shadowColor=cols[n.l];g.shadowBlur=16;g.beginPath();g.arc(n.l*lw+lw/2,y,20,0,7);g.fill();g.shadowBlur=0;g.globalAlpha=1;}
    g.fillStyle='#fff';g.font='bold 22px Bungee, sans-serif';g.textAlign='left';g.fillText('x'+FLOW.combo,14,34);g.textAlign='right';g.fillText(FLOW.hits+'/'+FLOW.total,w-14,34);
    if(FLOW.msgT>0){FLOW.msgT-=dt;g.textAlign='center';g.font='bold 30px Bungee, sans-serif';g.fillStyle=FLOW.msg==='OFF BEAT'?'#ff5f6d':'#ffd23f';g.fillText(FLOW.msg,w/2,h*.42);}
    if(now>FLOW.end+.3){const reward=FLOW.hits*3+FLOW.perf*2;S.coins+=reward;S.total+=reward;if(FLOW.hits>S.flowBest)S.flowBest=FLOW.hits;FLOWRES={...FLOW,reward};FLOW=null;save();sfxJingle();confetti(40);
      toast(`🎙️ <b>Freestyle done!</b> ${FLOWRES.hits}/${FLOWRES.total} hits · ${FLOWRES.perf} perfect · best combo ${FLOWRES.best} · +${reward} coins`);setTimeout(()=>{checkAch();if(curTab==='flow'&&mode==='studio')renderTab(false);},600);}
  }else{g.textAlign='center';g.fillStyle='rgba(255,255,255,.8)';g.font='bold 20px Bungee, sans-serif';g.fillText(FLOWRES?`${FLOWRES.hits}/${FLOWRES.total} HITS · +${FLOWRES.reward}`:'PRESS START',w/2,h*.42);

// live kick detection from the song's low end
function songBeat(){
  if(!songAn||!songEl||songEl.paused||!S.musicOn||S.muted)return;
  songAn.getByteFrequencyData(songBuf);
  let e=0;for(let i=1;i<6;i++)e+=songBuf[i];e/=5;
  songAvg=songAvg*.93+e*.07;
  const now=AC.currentTime;
  if(e>songAvg*1.13&&e>105&&now-lastKick>.26){const gap=now-lastKick;if(gap<1.2)kickGap=kickGap*.8+gap*.2;lastKick=now;lastBeat=now;beatPulse=1;}
}
function songOnBeat(){if(!songEl||songEl.paused)return false;const now=AC.currentTime;const since=now-lastKick,until=lastKick+kickGap-now;return since<.11||(until>=0&&until<.1);}

}

function eventMult(){const e=curEvent();return e.ok(curChar())?1.25:1;}
// ---- daily challenge (seeded course) ----
let _origRand=null;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dailySeed(){const d=todayStr();let h=2166136261;for(const ch of d)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0;}
function startDaily(){LV=null;R&&(R.daily=true);_origRand=Math.random;Math.random=mulberry(dailySeed());window.__daily=true;startRun();if(R)R.daily=true;setTimeout(()=>{if(mode==='play')bigText('<span style="font-size:36px">DAILY CHALLENGE</span>','Same course for everyone today');},1600);}
function endDaily(){if(!window.__daily)return;window.__daily=false;if(_origRand){Math.random=_origRand;_origRand=null;}
  if(R&&R.daily){const sc=Math.floor(R.score);S.daily=S.daily||{};if(S.daily.date!==todayStr())S.daily={date:todayStr(),best:0,tries:0};S.daily.tries++;const nb=sc>S.daily.best;if(nb)S.daily.best=sc;save();
    setTimeout(()=>{const t=$('oTip');if(t)t.innerHTML=`<b>Daily Challenge</b> · today's best <b>${fmt(S.daily.best)}</b>${nb?' — new daily record!':''} · try #${S.daily.tries}<br><span style="opacity:.75">A new course drops every day at midnight.</span>`;},60);}}
function refreshDailyBtn(){const b=$('dailyRunBtn');if(!b)return;const d=S.daily&&S.daily.date===todayStr()?S.daily.best:0;b.innerHTML=ic('target','#ffd23f')+' DAILY CHALLENGE'+(d?` · best ${fmt(d)}`:'');const e=$('evPill');if(e){const ev=curEvent();e.innerHTML=ic('flame','#ff8a3d')+` <b>${ev.n}</b> · ${ev.d}`;}}
// ---- run start / per-frame ----
function runFeaturesStart(){R.combo=0;R.comboT=0;R.nextHeli=1000;R.heli=0;R.nextVinyl=260+Math.random()*200;R.stepT=0;R.cmbVF=R.cmbGB=0;R.finale=false;
  const b=(LV&&LV.biome)||'city';if(b!=='desert'&&b!=='snow'&&Math.random()<(window.__daily?.0:.3))rainStart();else rainStop();}
function featTick(dt,rdt){
  if(R.comboT>0){R.comboT-=rdt;if(R.comboT<=0)R.combo=0;}
  if(R.cmbVF&&!(R.jet>0&&R.magnet>0))R.cmbVF=0;if(R.cmbGB&&!(R.shoes>0&&R.dbl>0))R.cmbGB=0;
  // footsteps
  if(R.onGround&&R.jet<=0&&R.board<=0&&R.slide<=0&&!R.finale){R.stepT-=dt*R.speed/13;if(R.stepT<=0){R.stepT=.28;sfxStep(R.gnd>=TH-.05);}}
  // chopper chase every 1000 m
  if(!R.finale&&R.dist>R.nextHeli){R.nextHeli+=1000;heliStart();}
  if(R.heli>0){R.heli-=rdt;if(R.heli<=0){heliStop();if(R.alive){R.score+=1000*S.mult;bigText('<span style="font-size:34px">ESCAPED THE CHOPPER</span>','+'+fmt(1000*S.mult));sfxJingle();}}}

  if(R.dist>R.nextVinyl){R.nextVinyl+=700+Math.random()*500;const ln=Math.floor(Math.random()*3);if(laneFree(ln,PZ+70))R.objs.push({k:'pup',type:'vinyl',x:laneX(ln),y:1.05,z:PZ+70});}

  if(R.finale)for(const o of R.objs)if(o.k!=='coin'&&o.k!=='pup'&&o.z<PZ+45)o.gone=true;
  rainTick(dt);heliTick(rdt);
}

const vinylLabel=canvasTex(256,256,(g,w,h)=>{g.clearRect(0,0,w,h);const gr=g.createRadialGradient(w/2,h/2,10,w/2,h/2,128);gr.addColorStop(0,'#ffe68a');gr.addColorStop(1,'#d98a0c');g.fillStyle=gr;g.beginPath();g.arc(w/2,h/2,120,0,7);g.fill();g.fillStyle='#1a0b2e';g.font='54px Bungee, Arial Black';g.textAlign='center';g.textBaseline='middle';g.fillText('FAME',w/2,h/2-20);g.font='800 22px Outfit';g.fillText('GOLD RECORD',w/2,h/2+30);g.beginPath();g.arc(w/2,h/2,10,0,7);g.fillStyle='#111';g.fill();});
function makeVinyl(){const g=new THREE.Group();const disc=new THREE.Group();
  const rec=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.02,48),new THREE.MeshStandardMaterial({color:'#ffd23f',metalness:1,roughness:.18,emissive:'#ff9a00',emissiveIntensity:.35}));rec.rotation.x=Math.PI/2;disc.add(rec);
  for(const r of [.3,.34,.38]){const gr=new THREE.Mesh(new THREE.TorusGeometry(r,.004,4,48),new THREE.MeshStandardMaterial({color:'#b37a00',metalness:1,roughness:.4}));disc.add(gr);}
  for(const sd of [1,-1]){const lb=new THREE.Mesh(new THREE.CircleGeometry(.2,32),new THREE.MeshBasicMaterial({map:vinylLabel,toneMapped:false}));lb.position.z=sd*.012;if(sd<0)lb.rotation.y=Math.PI;disc.add(lb);}

// ---- weather: rain ----
let RAIN3=null;
function rainStart(){if(!RAIN3){const N=1400,pos=new Float32Array(N*6);for(let i=0;i<N;i++){const x=(Math.random()-.5)*26,y=Math.random()*16,z=(Math.random()-.5)*40;pos.set([x,y,z,x+.05,y-.55,z+.12],i*6);}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));RAIN3=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:'#b9c8ee',transparent:true,opacity:.42,depthWrite:false}));RAIN3.frustumCulled=false;scene.add(RAIN3);}

function rainTick(dt){if(!RAIN3||!RAIN3.visible)return;const p=RAIN3.geometry.attributes.position,a=p.array;const fall=dt*22,push=dt*R.speed*.5;
  for(let i=0;i<a.length;i+=6){a[i+1]-=fall;a[i+4]-=fall;a[i+2]+=push;a[i+5]+=push;if(a[i+1]<0||a[i+2]>20){const x=(Math.random()-.5)*26,y=12+Math.random()*4,z=-20+Math.random()*10;a[i]=x;a[i+1]=y;a[i+2]=z;a[i+3]=x+.05;a[i+4]=y-.55;a[i+5]=z+.12;}}
  p.needsUpdate=true;RAIN3.position.set(camera.position.x,0,camera.position.z-14);
  RAIN3.userData.snd-=dt;if(RAIN3.userData.snd<=0&&AC&&!S.muted){RAIN3.userData.snd=.5;noise(AC.currentTime,.6,2400,.035,sfxBus,8000);}}
// ---- chopper chase ----
let HELI=null;
function buildHeli(){const g=new THREE.Group();const body=mat('#1c1e26',{r:.35,m:.7}),glass=new THREE.MeshStandardMaterial({color:'#20304a',roughness:.05,metalness:.9,envMapIntensity:2});
  const cab=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),body);cab.scale.set(.9,.75,1.3);g.add(cab);const win=new THREE.Mesh(new THREE.SphereGeometry(1,24,16,0,Math.PI*2,0,Math.PI/2.2),glass);win.scale.set(.85,.7,1.0);win.rotation.x=-Math.PI/2.3;win.position.set(0,.05,.45);g.add(win);
  const boom=new THREE.Mesh(new THREE.CylinderGeometry(.12,.22,2.6,12),body);boom.rotation.x=Math.PI/2;boom.position.set(0,.15,-2.1);g.add(boom);
  const fin=box(body,.06,.7,.45,0,.5,-3.3);g.add(fin);const trot=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.02,16),new THREE.MeshBasicMaterial({color:'#888',transparent:true,opacity:.35}));trot.rotation.z=Math.PI/2;trot.position.set(.1,.45,-3.3);g.add(trot);
  for(const sd of [-1,1]){g.add(box(mat('#3a3d48',{m:.8,r:.4}),.05,.05,2.1,sd*.6,-.95,0));g.add(box(mat('#3a3d48',{m:.8,r:.4}),.04,.45,.04,sd*.55,-.72,.5));g.add(box(mat('#3a3d48',{m:.8,r:.4}),.04,.45,.04,sd*.55,-.72,-.5));}
  const mast=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.35,10),body);mast.position.y=.85;g.add(mast);
  const rotor=new THREE.Group();rotor.position.y=1.03;for(let i=0;i<4;i++){const bl=box(mat('#111',{r:.5}),.16,.03,3.6,0,0,0);bl.rotation.y=i*Math.PI/4;rotor.add(bl);}
  rotor.add(new THREE.Mesh(new THREE.CylinderGeometry(3.6,3.6,.01,32),new THREE.MeshBasicMaterial({color:'#999',transparent:true,opacity:.12,depthWrite:false})));g.add(rotor);
  const beacon=new THREE.Mesh(G.sph,new THREE.MeshStandardMaterial({color:'#ff2030',emissive:'#ff2030',emissiveIntensity:6}));beacon.scale.setScalar(.07);beacon.position.set(0,-.7,.2);g.add(beacon);
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.22,14),mat('#ddd',{m:.9,r:.2}));lamp.position.set(0,-.72,.8);g.add(lamp);
  const sl=new THREE.SpotLight('#eaf2ff',60,30,.32,.55,1.2);sl.position.set(0,-.8,.8);g.add(sl);const tgt=new THREE.Object3D();scene.add(tgt);sl.target=tgt;
  const cone=new THREE.Mesh(new THREE.ConeGeometry(1,1,28,1,true),new THREE.MeshBasicMaterial({color:'#dfe9ff',transparent:true,opacity:.11,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));scene.add(cone);
  const spot=new THREE.Mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({map:glowTex,color:'#eaf2ff',transparent:true,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false}));spot.rotation.x=-Math.PI/2;scene.add(spot);
  g.visible=cone.visible=spot.visible=false;scene.add(g);tame(g);return {g,rotor,trot,beacon,sl,tgt,cone,spot,snd:0,x:0};}
function heliStart(){if(!HELI)HELI=buildHeli();R.heli=18;HELI.g.visible=HELI.cone.visible=HELI.spot.visible=true;HELI.x=R.x;HELI.y=14;bigText('<span style="font-size:36px">CHOPPER CHASE!</span>','Coins count double in the spotlight');sfxHorn();}
function heliStop(){if(HELI){HELI.g.visible=HELI.cone.visible=HELI.spot.visible=false;}if(R)R.heli=0;}
function heliTick(dt){if(!HELI||!HELI.g.visible)return;const H=HELI;H.x=lerp(H.x,R.x,Math.min(1,dt*1.5));const leaving=R.heli<2;H.y=lerp(H.y,leaving?16:6.2,Math.min(1,dt*(leaving?.8:1.2)));
  H.g.position.set(H.x+Math.sin(T*.7)*.6,H.y+Math.sin(T*1.3)*.15,-(PZ+9));H.g.rotation.set(.18,Math.PI,Math.sin(T*.9)*.06);H.rotor.rotation.y+=dt*38;H.trot.rotation.x+=dt*50;H.beacon.visible=Math.floor(T*2)%2===0;

// ---- concert finale stage ----
function crowdCheer(){if(!AC)return;for(let i=0;i<6;i++)setTimeout(()=>noise(AC.currentTime,1.2,1800,.12,sfxBus,5000),i*350);}
function makeStage(){const g=new THREE.Group();const deck=mat('#14101c',{r:.6,m:.3}),truss=new THREE.MeshStandardMaterial({color:'#c9ccd6',metalness:1,roughness:.3});
  g.add(box(deck,9,1.1,4.5,0,.55,-2.25));g.add(box(mat('#ffd23f',{e:'#ffb000',ei:2}),9.02,.06,.06,0,1.1,0));
  for(const sx of [-4.2,4.2])for(const sz of [-.2,-4.3]){const t=box(truss,.18,7,.18,sx,4.6,sz);g.add(t);}
  g.add(box(truss,8.6,.18,.18,0,8,-.2));g.add(box(truss,8.6,.18,.18,0,8,-4.3));
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(6.4,3.6),new THREE.MeshBasicMaterial({map:thumbTex(Math.floor(Math.random()*THUMBS.length),'bill'),toneMapped:false}));scr.position.set(0,4.6,-4.2);g.add(scr);
  for(const sx of [-3.6,3.6]){g.add(box(mat('#0b0b10',{r:.7}),1.1,2.4,1,sx,2.3,-3.2));for(const yy of [1.6,2.6]){const cone=new THREE.Mesh(new THREE.CircleGeometry(.32,24),mat('#2a2a33',{r:.4,m:.6}));cone.position.set(sx,yy,-2.69);g.add(cone);}}
  const beams=[];for(let i=0;i<6;i++){const col=['#ff5fb0','#4ff7ff','#ffd23f'][i%3];const b=new THREE.Mesh(new THREE.ConeGeometry(.9,9,20,1,true),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    const piv=new THREE.Group();piv.position.set(-3.6+i*1.44,7.9,-.2);b.position.y=-4.5;piv.add(b);g.add(piv);beams.push(piv);}
  // crowd lining the track
  const N=90,cg=new THREE.CapsuleGeometry(.2,.7,4,8),cm=new THREE.MeshStandardMaterial({roughness:.8});const crowd=new THREE.InstancedMesh(cg,cm,N);const base=[];const m4=new THREE.Matrix4(),col=new THREE.Color();
  for(let i=0;i<N;i++){const sd=i%2?1:-1;const x=sd*(2.6+Math.random()*3.2),z=2+Math.random()*16;base.push([x,z,Math.random()*6]);m4.makeTranslation(x,.6,z);crowd.setMatrixAt(i,m4);col.setHSL(Math.random(),.6,.45+Math.random()*.2);crowd.setColorAt(i,col);}

function stageTick(s){const u=s.mesh.userData;u.beams.forEach((b,i)=>{b.rotation.z=Math.sin(T*1.4+i)*.45;b.rotation.x=Math.cos(T*1.1+i*.7)*.3;});
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(1,1,1),ps=new THREE.Vector3();u.base.forEach(([x,z,ph],i)=>{const j=Math.abs(Math.sin(T*6+ph))*.35;m4.makeTranslation(x,.6+j,z);u.crowd.setMatrixAt(i,m4);m4.makeTranslation(x,1.32+j,z);u.heads.setMatrixAt(i,m4);

// ---- auto quality: keeps phones smooth ----
let _fpsAcc=0,_fpsN=0,_fpsT=0;
function autoQuality(dt){if(mode!=='play')return;_fpsAcc+=dt;_fpsN++;_fpsT+=dt;if(_fpsT<3)return;const fps=_fpsN/_fpsAcc;_fpsAcc=_fpsN=_fpsT=0;
  if(fps<44&&qScale>.6){qScale=Math.max(.6,qScale-.15);setupCanvas();}else if(fps<40&&renderer.shadowMap.enabled){renderer.shadowMap.enabled=false;}else if(fps>57&&qScale<1){qScale=Math.min(1,qScale+.1);setupCanvas();}}

function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render(dt);autoQuality(dt);
  if(mode==='play'){hudTick+=dt;if(hudTick>.05){hudTick=0;$('hScore').firstChild.nodeValue=fmt(R.score);updateComboHud();$('hDist').textContent=fmt(R.dist)+' m';$('hCoins').textContent=fmt(R.coins);$('hBoardN').textContent=S.boards;updatePups();}}
  if(mode==='studio'&&curTab==='flow')drawFlow(dt);
  if(mode==='studio'&&curTab==='studio'){roomTick+=dt;if(roomTick>.1){roomTick=0;const r=$('room');if(r)drawRoom(r);}}
  requestAnimationFrame(loop);
}

if(S.runs===0)setTimeout(()=>mode==='menu'&&toast('🎤 <b>Welcome to Fame the Game!</b> Run the tracks, stack coins, then build Fame Records into an empire. You start with 3 FAME Boards — double-tap to ride.'),2600);
